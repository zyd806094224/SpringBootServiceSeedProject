# 项目相关配置
seed:
  # 名称
  name: SeedProject
  # 版本
  version: 0.0.1-SNAPSHOT
  # 版权年份
  copyrightYear: 2026
  # 文件路径
  profile: ${user.dir}/uploads
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口
  port: 8066
  servlet:
    # 应用的访问路径
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数
    accept-count: 1000
    threads:
      # tomcat最大线程数
      max: 800
      # Tomcat启动初始化的线程数
      min-spare: 100

# 日志配置
logging:
  level:
    com.zyd.springbootserviceseedproject: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  application:
    name: seed-project
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid-prod
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 100MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # 连接池最大阻塞等待时间
          max-wait: -1ms
  # 邮件配置(QQ邮箱SMTP)
  mail:
    host: smtp.qq.com
    port: 465
    username: 806094224@qq.com
    password: hdklhbedwaqybaji
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.zyd.springbootserviceseedproject.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# MyBatis Plus配置
mybatis-plus:
  global-config:
    db-config:
      # 主键类型
      id-type: auto
      # 逻辑删除配置
      logic-delete-field: delFlag
      logic-delete-value: "2"
      logic-not-delete-value: "0"
  configuration:
    # 开启驼峰命名
    map-underscore-to-camel-case: true

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '全部接口'
      paths-to-match: '/**'
      packages-to-scan: com.zyd.springbootserviceseedproject.web.controller

# XXL-JOB配置
xxl:
  job:
    admin:
      addresses: http://127.0.0.1:8061/xxl-job-admin
      accessToken: default_token
    executor:
      appname: xxl-job-executor
      address:
      ip:
      port: 9999
      logpath: ./logs/xxl-job/jobhandler
      logretentiondays: 30

# 文件上传配置
file:
  upload:
    path: ${user.dir}/uploads
    allowed-types: .jpg,.jpeg,.png,.gif,.bmp,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip,.rar
    max-size: 10485760
    max-count: 10

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1

# 提醒模块配置
reminder:
  enabled: true
  default-recipient: 806094224@qq.com
  default-remind-before-days: 7
  default-overdue-frequency: 1
  default-remind-time: "09:00"

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
